
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa - Component</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #3d3025;
    }

    .card {
      width: 100%;
      max-width: 340px;
      padding: 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e7d8c4;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(61, 48, 37, 0.12);
    }

    .profile-photo {
      width: 100px;
      height: 100px;
      margin-bottom: 16px;
      border: 3px solid #d6b98c;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-name {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .profile-nim {
      margin: 0 0 20px;
      color: #766553;
      overflow-wrap: anywhere;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #795536;
      color: #ffffff;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #5c3d25;
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      <img
       class="profile-photo"
       src="./sofyan.jpeg"
       alt="Foto profil Softianto"
>
    >
    <h1 class="profile-name">Softianto</h1>
    <p class="profile-nim">NIM: 2024520009</p>
    <a class="btn" href="https://github.com/009-sofyan">
      Lihat Profil
    </a>
  </main>
</body>
</html>
